# Сайт underfire: сборка клиента (web/dist) и ассеты релиза. Ставит web/deploy/deploy.sh --nginx,
# __DOMAIN__ он заменяет на UF_DOMAIN из .env или на «_» (любой Host, ответ по IP).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    root /var/www/underfire/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # Сборка Vite: файлы в static/ с хэшем в имени — кэшировать надолго, index.html — не кэшировать
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Ассеты игры (tools/fetch_assets.py на сервере): меняются только с новым релизом
    location /assets/ {
        alias /var/www/underfire/assets/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
